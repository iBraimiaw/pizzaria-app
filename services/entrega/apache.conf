# Só a pasta public/ fica exposta na web. A pasta src/ (lógica) fica fora do
# alcance do navegador: ninguém consegue baixar ou executar src/*.php direto.
<VirtualHost *:80>
    DocumentRoot /var/www/public

    <Directory /var/www/public>
        Require all granted
        # Qualquer caminho (/health, /v1/entrega/calcular...) cai no index.php
        FallbackResource /index.php
    </Directory>

    # Logs vão para a saída do container -> aparecem em "docker compose logs entrega"
    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>
